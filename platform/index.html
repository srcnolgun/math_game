<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF8EC">
<title>Sayı Diyarı</title>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2A1E3F;--cream:#FFF8EC;--pink:#FF6B8B;--amber:#FFB627;--blue:#3FA7F5;--purple:#8C5CF0;--green:#2FCB7A;--red:#FF5A5F;--gold:#FFD23F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#BDEBFF;color:var(--ink);font-family:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
#game{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
.hidden{display:none!important}

.pill{background:var(--cream);border:3px solid var(--ink);border-radius:999px;height:42px;padding:0 12px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:22px;line-height:1;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
.pill b{padding-top:3px}
.pill.bump{animation:pop .35s}
.coin-ic{display:block;width:22px;height:22px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);box-shadow:inset -3px -2px 0 #F2A81D;flex:none}
.pstar{width:24px;height:24px;fill:var(--gold);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;flex:none}
.icon-btn{pointer-events:auto;width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:var(--cream);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0;flex:none;font-size:22px;line-height:1}
.icon-btn svg{width:18px;height:18px;fill:var(--ink)}
.icon-btn img{width:38px;height:38px;display:block}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

.overlay{position:fixed;inset:0;display:flex;padding:18px;padding-top:calc(env(safe-area-inset-top) + 18px);overflow-y:auto;touch-action:pan-y;background:rgba(42,30,63,.42);z-index:30}
.panel{margin:auto;width:min(460px,100%);background:var(--cream);border:4px solid var(--ink);border-radius:30px;box-shadow:0 9px 0 var(--ink);padding:18px 18px 20px;text-align:center}
.h2{margin:0;font-weight:800;font-size:clamp(32px,9vw,44px);line-height:1.05}
.lead{margin:8px 0 0;font-size:18px;font-weight:600;line-height:1.35}
.big{display:block;width:100%;margin-top:16px;border:4px solid var(--ink);border-radius:22px;background:var(--green);color:#fff;font-weight:800;font-size:32px;line-height:1;padding:13px 0 9px;box-shadow:0 7px 0 var(--ink);text-shadow:0 3px 0 var(--ink);pointer-events:auto}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.big:disabled{opacity:.45;transform:none;box-shadow:0 7px 0 var(--ink)}
.btn2{display:block;width:100%;margin-top:12px;border:3px solid var(--ink);border-radius:18px;background:#fff;font-weight:800;font-size:21px;padding:8px 0 5px;box-shadow:0 5px 0 var(--ink)}
.btn2:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.label{font-weight:800;font-size:18px;margin:16px 2px 8px}
.review{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rv{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 10px 1px;font-weight:800;font-size:21px;line-height:1.2}
.rv small{display:block;font-size:13px;font-weight:600;color:#7a6f8c}
.perfect{font-weight:800;font-size:20px;margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 2px 4px}
.stats b{display:block;font-size:30px;line-height:1}
.stats span{display:block;font-size:14px;font-weight:700;margin-top:2px}
.bigstars{display:flex;justify-content:center;gap:6px;margin-top:10px}
.bigstars i{width:74px;height:74px;display:block}
.bigstars i:nth-child(2){margin-top:-14px}
.bigstars svg{width:100%;height:100%;fill:#E4DDEB;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.bigstars i.on svg{fill:var(--gold);animation:starin .55s both;animation-delay:var(--d)}
.startip{font-size:15px;font-weight:600;margin:8px 0 0;color:#6d6280}
.tipart{font-size:64px;line-height:1.1}

/* character select */
#scrChar{position:fixed;inset:0;display:flex;padding:18px;padding-top:calc(env(safe-area-inset-top) + 18px);overflow-y:auto;touch-action:pan-y;z-index:15;background:radial-gradient(circle at 50% 0%,#FFF1C9 0,#FFD0E6 38%,#BFE6FF 80%)}
.logo{margin:0 0 4px;font-weight:800;line-height:.86;font-size:clamp(54px,16vw,80px);text-align:center}
.logo span{display:block;text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink),0 7px 0 var(--ink)}
.logo span:first-child{color:var(--amber);transform:rotate(-4deg)}
.logo span:last-child{color:var(--green);transform:rotate(3deg);margin-top:6px}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.charcard{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;transition:transform .15s}
.charcard canvas{width:100%;aspect-ratio:1/1.15;display:block}
.charcard b{font-size:21px;line-height:1.1}
.charcard.on{background:#FFF1B8;transform:translateY(-5px);box-shadow:0 10px 0 var(--ink)}

/* map */
#scrMap{position:fixed;inset:0;display:flex;flex-direction:column;z-index:10;background:#BDEBFF}
.mapbar{display:flex;align-items:center;gap:7px;padding:calc(env(safe-area-inset-top) + 8px) 10px 9px;background:var(--cream);border-bottom:4px solid var(--ink);z-index:2}
.maptitle{font-weight:800;font-size:22px;line-height:1;flex:1;white-space:nowrap;overflow:hidden}
.mapbar .pill{height:38px;font-size:19px;padding:0 10px;box-shadow:0 3px 0 var(--ink)}
.mapscroll{flex:1;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.world{position:relative;height:610px;border-bottom:4px solid var(--ink);overflow:hidden}
.winner{position:relative;max-width:540px;height:100%;margin:0 auto}
.wname{position:absolute;top:16px;left:50%;transform:translateX(-50%) rotate(-2deg);white-space:nowrap;background:var(--cream);border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);padding:3px 16px 0 6px;font-weight:800;font-size:22px;display:flex;align-items:center;gap:8px;z-index:2}
.wop{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);color:#fff;font-size:26px;line-height:1;margin-bottom:3px;text-shadow:0 2px 0 var(--ink)}
.wpath{position:absolute;inset:0;width:100%;height:100%}
.wpath path{fill:none;stroke:var(--ink);stroke-width:6;stroke-dasharray:1 14;stroke-linecap:round;opacity:.45}
.deco{position:absolute;font-size:40px;line-height:1;transform:translate(-50%,-50%);pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;border:4px solid var(--ink);background:var(--acc);box-shadow:0 6px 0 var(--ink);color:#fff;font-weight:800;font-size:38px;line-height:1;padding:7px 0 0;text-shadow:0 3px 0 var(--ink);z-index:1}
.node:active{transform:translate(-50%,calc(-50% + 4px));box-shadow:0 2px 0 var(--ink)}
.node.locked{background:#D6D0DF;padding:0;display:grid;place-items:center}
.node .lock{width:34px;height:34px;fill:#A69CB6;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.node .lock path{fill:none}
.node .st{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);display:flex;gap:1px}
.node .st i{display:block;width:22px;height:22px}
.node .st svg{width:100%;height:100%;fill:#fff;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.node .st i.on svg{fill:var(--gold)}
.node.nope{animation:nodeshake .4s}
.avatar{position:absolute;width:72px;height:72px;transform:translate(-50%,-100%);pointer-events:none;z-index:3;animation:bob 1.1s ease-in-out infinite}
.mapfoot{padding:22px 16px 40px;text-align:center;background:var(--cream)}
.mapfoot p{margin:0 0 10px;font-weight:600;font-size:16px}
.reset{background:none;border:none;font-weight:700;font-size:15px;color:#7a6f8c;text-decoration:underline;padding:6px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;z-index:5}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:760px;margin:0 auto}
.hearts{display:flex;gap:2px}
.heart{width:32px;height:32px;fill:var(--pink);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.heart.empty{fill:rgba(255,255,255,.6)}
.heart.pop{animation:pop .5s}
.lvlpill{font-size:18px;padding:0 12px 0 5px;height:38px}
.lop{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);color:#fff;font-size:22px;line-height:1;padding-bottom:2px}
.tr{display:flex;gap:8px;align-items:center}
.qcard{position:relative;margin:10px auto 0;max-width:520px;background:var(--cream);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:4px 12px 12px;text-align:center}
.qcard.in{animation:fadein .25s}
.qhint{font-weight:700;font-size:17px;line-height:1.2;margin-top:3px;color:#5e5273}
.qtext{font-weight:800;font-size:clamp(34px,10vw,54px);line-height:1.2;white-space:nowrap}
.qm{display:inline-block;min-width:1.25em;padding:0 .18em;border-radius:14px;background:var(--purple);color:#fff;border:3px solid var(--ink);line-height:1.05;text-shadow:0 3px 0 var(--ink)}
.qm.ok{background:var(--green)} .qm.no{background:var(--red)}
.chip{display:inline-block;vertical-align:middle;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:2px 12px 0;font-size:.5em;line-height:1.2;margin:4px 3px}
.chip b{font-size:1.6em;line-height:1}
.chip.goal{background:var(--purple);color:#fff;text-shadow:0 2px 0 var(--ink)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.opt{pointer-events:auto;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);color:#fff;font-weight:800;font-size:clamp(24px,7vw,34px);line-height:1;padding:9px 0 5px;text-shadow:0 2px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink)}
.opt[data-i="0"]{background:var(--pink)} .opt[data-i="1"]{background:var(--amber)} .opt[data-i="2"]{background:var(--blue)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.right{background:var(--green)!important;animation:pop .4s}
.opt.wrong{background:var(--red)!important;animation:shake .4s}
.opt.dim{opacity:.35}
.qexp{margin:2px 0 0;font-size:16px;font-weight:600;line-height:1.3}
#readyBtn{font-size:26px;padding:10px 0 7px;margin-top:10px}
.targetpill{margin:10px auto 0;width:max-content;background:var(--cream);border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);padding:3px 16px 0;font-weight:700;font-size:19px;display:flex;gap:8px;align-items:center}
.targetpill b{font-size:30px;font-weight:800;line-height:1.1}
.targetpill .now{color:var(--purple)}
.targetpill .now.pop{animation:pop .35s}
.targetpill .sep{width:3px;height:26px;background:var(--ink);border-radius:2px;margin:0 4px;opacity:.25}

#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:25;background:var(--cream);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:6px 18px 3px;font-weight:800;font-size:clamp(22px,6.5vw,34px);white-space:nowrap;transition:opacity .2s,transform .3s cubic-bezier(.2,1.5,.4,1)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.good{color:#138a4f} #toast.bad b{color:#d8323a}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes nodeshake{0%,100%{margin-left:0}25%{margin-left:-8px}75%{margin-left:8px}}
@keyframes bob{50%{margin-top:-7px}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes starin{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}

@media (max-width:440px){.maptitle{display:none}#mapCoinPill{margin-right:auto}}
@media (max-width:350px){.mapbar .pill{font-size:16px;padding:0 7px}}
@media (orientation:landscape) and (max-height:540px){
  .qcard{position:absolute;top:6px;left:50%;transform:translateX(-50%);margin:0;width:min(440px,52vw);padding:2px 10px 8px}
  .qtext{font-size:30px}
  .qhint{font-size:14px}
  .opt{font-size:22px;padding:5px 0 2px}
  .qexp{font-size:14px}
  #readyBtn{font-size:22px;padding:6px 0 3px;margin-top:6px}
  .lvlpill{display:none}
  .targetpill{position:absolute;top:8px;left:50%;transform:translateX(-50%);margin:0}
  .heart{width:26px;height:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<section id="scrChar" class="hidden">
  <div class="panel">
    <h1 class="logo"><span>Sayı</span><span>Diyarı</span></h1>
    <p class="lead">Maceraya kiminle çıkmak istersin?</p>
    <div class="chars">
      <button class="charcard" data-c="girl"><canvas></canvas><b>Defne</b></button>
      <button class="charcard" data-c="cat"><canvas></canvas><b>Tarçın</b></button>
      <button class="charcard" data-c="robot"><canvas></canvas><b>Bip</b></button>
    </div>
    <button class="big" id="charOk" disabled>Maceraya başla</button>
  </div>
</section>

<section id="scrMap" class="hidden">
  <header class="mapbar">
    <div class="maptitle">Sayı Diyarı</div>
    <div class="pill"><svg class="pstar" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg><b id="mapStars">0</b></div>
    <div class="pill" id="mapCoinPill"><i class="coin-ic"></i><b id="mapCoins">0</b></div>
    <button class="icon-btn" id="btnChar" aria-label="Karakter değiştir"><img id="avatarImg" alt=""></button>
    <button class="icon-btn" id="btnSound" aria-label="Sesi aç veya kapat">🔊</button>
  </header>
  <div class="mapscroll" id="mapScroll"></div>
</section>

<div id="hud" class="hidden">
  <div class="topbar">
    <div class="hearts" id="hearts"></div>
    <div class="pill lvlpill" id="lvlName"></div>
    <div class="tr">
      <div class="pill" id="coinPill"><i class="coin-ic"></i><b id="coins">0</b></div>
      <button class="icon-btn" id="pauseBtn" aria-label="Duraklat"><svg viewBox="0 0 18 18"><rect x="3" y="2" width="4" height="14" rx="1.5"/><rect x="11" y="2" width="4" height="14" rx="1.5"/></svg></button>
    </div>
  </div>
  <div class="targetpill hidden" id="targetPill">Hedef <b id="tpT">0</b><span class="sep"></span>Şu an <b id="tpNow" class="now">0</b></div>
  <div class="qcard hidden" id="qcard">
    <div class="qhint" id="qhint"></div>
    <div class="qtext" id="qtext"></div>
    <div class="opts" id="opts"><button class="opt" data-i="0"></button><button class="opt" data-i="1"></button><button class="opt" data-i="2"></button></div>
    <p class="qexp hidden" id="qexp">Zıplarsan üstteki altını, zıplamazsan alttakini alırsın.</p>
    <button class="big hidden" id="readyBtn">Hazırım!</button>
  </div>
</div>
<div id="toast"></div>

<div id="tip" class="overlay hidden">
  <div class="panel">
    <div class="tipart" id="tipArt"></div>
    <h2 class="h2" id="tipTitle"></h2>
    <p class="lead" id="tipText"></p>
    <button class="big" id="tipOk">Anladım!</button>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="panel">
    <h2 class="h2">Mola</h2>
    <p class="lead">Hazır olunca devam et.</p>
    <button class="big" id="resumeBtn">Devam et</button>
    <button class="btn2" id="soundBtn2">🔊 Ses açık</button>
    <button class="btn2" id="quitBtn">Haritaya dön</button>
  </div>
</div>

<div id="win" class="overlay hidden">
  <div class="panel">
    <h2 class="h2" id="winTitle">Bölüm tamam!</h2>
    <div class="bigstars" id="bigStars"></div>
    <p class="startip" id="starTip"></p>
    <div class="stats">
      <div><b id="stCorrect">0</b><span>Doğru</span></div>
      <div><b id="stWrong">0</b><span>Yanlış</span></div>
      <div><b id="stCoins">0</b><span>Altın</span></div>
    </div>
    <div class="label" id="winRevLabel">Bunları birlikte tekrar edelim</div>
    <div class="review" id="winReview"></div>
    <button class="big" id="nextBtn">Sonraki bölüm</button>
    <div class="row2"><button class="btn2" id="retryBtn">Tekrar oyna</button><button class="btn2" id="mapBtn">Harita</button></div>
  </div>
</div>

<div id="fail" class="overlay hidden">
  <div class="panel">
    <h2 class="h2">Canların bitti</h2>
    <p class="lead">Doğru cevaplara bir göz at, sonra tekrar dene.</p>
    <div class="review" id="failReview" style="margin-top:14px"></div>
    <button class="big" id="failRetry">Tekrar dene</button>
    <button class="btn2" id="failMap">Haritaya dön</button>
  </div>
</div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
const INK = '#2A1E3F';
const FONT = '"Baloo 2", ui-rounded, system-ui, sans-serif';
const ANS_COL = ['#FF6B8B', '#FFB627', '#3FA7F5'];
const CONFETTI = ['#FF6B8B', '#FFB627', '#3FA7F5', '#2FCB7A', '#8C5CF0', '#FFD23F'];
const PRAISE = ['Harika!', 'Süper!', 'Aferin!', 'Bravo!', 'Muhteşem!', 'Çok iyi!'];
const STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>';
const HEART_SVG = '<svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.6-4.7-10-9.3C.4 8.2 2.3 3.8 6.3 3.8c2.3 0 3.8 1.4 5.7 3.6 1.9-2.2 3.4-3.6 5.7-3.6 4 0 5.9 4.4 4.3 7.9C19.6 16.3 12 21 12 21z"/></svg>';
const DEBUG = /debug/.test(location.hash);
const LOCK_SVG = '<svg class="lock" viewBox="0 0 24 24"><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/><rect x="5" y="10" width="14" height="11" rx="3"/></svg>';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ================= KAYIT ================= */
const SAVE_KEY = 'sayi-diyari-v1';
const save = { char: null, stars: {}, coins: 0, sound: true, tips: {}, last: null };

let actx = null, soundOn = true;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type = 'sine', vol = 0.12, when = 0, slideTo = null) {
  if (!soundOn || !actx) return;
  const t = actx.currentTime + when;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
}

/* ================= SORULAR ================= */
function genQ(op, d) {
  let a, b, ans;
  if (op === '+') {
    const r = [[1, 10, 1, 10], [5, 20, 3, 15], [10, 50, 5, 40], [20, 80, 11, 79], [100, 499, 50, 399]][d];
    a = rnd(r[0], r[1]); b = rnd(r[2], r[3]); ans = a + b;
  } else if (op === '−') {
    if (d === 0) { a = rnd(5, 15); b = rnd(1, a); }
    else if (d === 1) { a = rnd(10, 30); b = rnd(2, a - 1); }
    else if (d === 2) { a = rnd(30, 99); b = rnd(5, a - 5); }
    else if (d === 3) { a = rnd(50, 99); b = rnd(11, a - 10); }
    else { a = rnd(200, 999); b = rnd(50, a - 50); }
    ans = a - b;
  } else if (op === '×') {
    if (d === 0) { a = pick([2, 5, 10]); b = rnd(1, 10); }
    else if (d === 1) { a = rnd(2, 5); b = rnd(2, 10); }
    else if (d === 2) { a = rnd(6, 9); b = rnd(2, 10); }
    else if (d === 3) { a = rnd(2, 10); b = rnd(2, 10); }
    else { a = rnd(11, 20); b = rnd(2, 9); }
    ans = a * b;
  } else {
    let dv, qq;
    if (d === 0) { dv = pick([2, 5, 10]); qq = rnd(1, 10); }
    else if (d === 1) { dv = rnd(2, 5); qq = rnd(2, 10); }
    else if (d === 2) { dv = rnd(6, 9); qq = rnd(2, 10); }
    else if (d === 3) { dv = rnd(2, 10); qq = rnd(2, 10); }
    else { dv = rnd(2, 9); qq = rnd(11, 20); }
    a = dv * qq; b = dv; ans = qq;
  }
  return { op, a, b, ans, text: `${a} ${op} ${b}` };
}

function makeOptions(q) {
  const { op, a, b, ans } = q;
  const near = [1, -1, 2, -2];
  let c;
  if (op === '+' || op === '−') { c = [ans + 10, ans - 10, ...near.map(n => ans + n)]; if (ans >= 100) c.push(ans + 100, ans - 100); }
  else if (op === '×') c = [ans + a, ans - a, ans + b, ans - b, ans + 1, ans - 1];
  else c = near.map(n => ans + n);
  const pool = shuffle([...new Set(c)].filter(v => v >= 0 && v !== ans));
  const picks = pool.slice(0, 2);
  let guard = 0;
  while (picks.length < 2 && guard++ < 50) { const v = ans + rnd(-6, 6); if (v >= 0 && v !== ans && !picks.includes(v)) picks.push(v); }
  const answers = shuffle([ans, ...picks]);
  return { answers, correct: answers.indexOf(ans) };
}

const applyOp = (v, op, n) => op === '+' ? v + n : op === '−' ? v - n : op === '×' ? v * n : v / n;

/* Hedef sayı: iki seçim çifti. İlk seçim serbest, ikinci seçimde doğru altını bulmak gerekir. */
function genTarget(op, d) {
  if (op === '+') {
    const m = [6, 10, 15, 25, 40][d];
    for (let k = 0; k < 400; k++) {
      const a1 = rnd(1, m), b1 = rnd(1, m), a2 = rnd(1, m);
      if (a1 === b1) continue;
      const T = a1 + a2, b2 = T - b1;
      if (b2 < 1 || b2 === a2) continue;
      return { start: 0, T, pairs: [[a1, b1], [a2, b2]] };
    }
    return { start: 0, T: 7, pairs: [[3, 4], [4, 3]] };
  }
  if (op === '−') {
    const m = [5, 9, 15, 25, 40][d];
    for (let k = 0; k < 400; k++) {
      const a1 = rnd(1, m), b1 = rnd(1, m), a2 = rnd(1, m);
      if (a1 === b1) continue;
      const b2 = a1 + a2 - b1;
      if (b2 < 1 || b2 === a2) continue;
      const T = rnd(m, 2 * m);
      return { start: T + a1 + a2, T, pairs: [[a1, b1], [a2, b2]] };
    }
    return { start: 12, T: 5, pairs: [[3, 4], [4, 3]] };
  }
  const maxF = op === '×' ? [6, 8, 10, 12, 15][d] : [4, 6, 8, 10, 12][d];
  for (let k = 0; k < 900; k++) {
    const a1 = rnd(2, maxF), a2 = rnd(2, maxF), b1 = rnd(2, maxF);
    if (a1 === b1) continue;
    const P = a1 * a2;
    if (P % b1) continue;
    const b2 = P / b1;
    if (b2 < 2 || b2 > maxF || b2 === a2) continue;
    if (op === '×') {
      const start = rnd(1, d < 2 ? 2 : 3);
      if (start * P > [40, 80, 120, 200, 300][d]) continue;
      return { start, T: start * P, pairs: [[a1, b1], [a2, b2]] };
    }
    const T = rnd(1, 2 + d * 2), S = T * P;
    if (S > [48, 80, 120, 200, 300][d]) continue;
    if ((S / a1) % b2 || (S / b1) % a2) continue;
    return { start: S, T, pairs: [[a1, b1], [a2, b2]] };
  }
  return op === '×' ? { start: 1, T: 12, pairs: [[2, 3], [6, 4]] } : { start: 16, T: 2, pairs: [[2, 4], [4, 2]] };
}

/* ================= BÖLÜM ÜRETİMİ ================= */
function buildLevel(w, l) {
  const rand = mulberry32(7919 + w * 131 + l * 977);
  const ri = (a, b) => Math.floor(rand() * (b - a + 1)) + a;
  const wd = WORLDS[w];
  const Lv = { w, l, world: wd, segs: [], coins: [], hazards: [], enemies: [], events: [], deco: [], finishX: 0, finishH: 0 };
  let x = -12, h = 0;
  const ground = len => { Lv.segs.push({ x0: x, x1: x + len, h }); x += len; };
  const coinLine = (a, b, y) => { for (let c = a; c <= b + 1e-6; c += 1) Lv.coins.push({ x: c, y, taken: false }); };
  const coinArc = (a, b, base, height) => {
    const n = Math.max(3, Math.round(b - a));
    for (let i = 0; i <= n; i++) { const u = i / n; Lv.coins.push({ x: a + (b - a) * u, y: base + 0.6 + height * Math.sin(Math.PI * u), taken: false }); }
  };

  function filler() {
    const kinds = ['flat', 'pit', 'pit', 'step', 'hazard', 'enemy', 'tall', 'sky'];
    if (l >= 1) kinds.push('bigpit', 'bigpit');
    const t = kinds[ri(0, kinds.length - 1)];
    if (t === 'flat') { const len = ri(4, 6), a = x; ground(len); coinLine(a + 1, a + len - 1, h + 0.6); }
    else if (t === 'pit') { ground(2); const pw = Math.round((1.0 + rand() * 0.5) * 10) / 10; const a = x; x += pw; coinArc(a - 0.8, a + pw + 0.8, h, 1.1); ground(3); }
    else if (t === 'bigpit') { ground(3); const pw = Math.round((2.1 + rand() * (0.2 + l * 0.08)) * 10) / 10; const a = x; x += pw; coinArc(a - 0.9, a + pw + 0.9, h, 2.2); ground(3); }
    else if (t === 'tall') { ground(3); const a = x; if (h <= 1) { h += 2; coinArc(a - 1.2, a + 1.4, h - 2, 2.6); } else h -= 2; ground(ri(5, 6)); }
    else if (t === 'sky') { const a = x; ground(7); coinLine(a + 1, a + 2, h + 0.6); coinLine(a + 3, a + 5, h + 3.1); }
    else if (t === 'step') { ground(2); if (h >= 2 || (h > 0 && rand() < 0.5)) h -= 1; else h += 1; const len = ri(4, 6), a = x; ground(len); coinLine(a + 1.5, a + len - 1, h + 0.6); }
    else if (t === 'hazard') { ground(3); Lv.hazards.push({ x, w: 0.9, y: h }); coinArc(x - 1, x + 1.9, h, 1.4); ground(4); }
    else { ground(2); Lv.enemies.push({ x: x + 3, y: h, min: x + 0.8, max: x + 5.5, dir: -1, alive: true, t: rand() * 6 }); ground(7); }
  }
  function event(type) {
    if (type === 'cloud') {
      ground(3); const ex = x, pw = 6.2; x += pw;
      Lv.events.push({ type, trigger: ex - 0.45, ex, pw, h, state: 'idle',
        clouds: [0, 1, 2].map(i => ({ x: ex + 1.35 + i * 1.75, y: h - 0.1 + (i === 1 ? 0.55 : 0), alive: false, vis: 0, res: null, val: null })) });
      ground(3);
    } else if (type === 'door') {
      ground(4); Lv.events.push({ type, trigger: x - 1.0, x: x + 0.1, h, state: 'idle', open: 0, shake: 0 }); ground(4);
    } else if (type === 'chest') {
      ground(3); Lv.events.push({ type, trigger: x - 0.2, x: x + 0.9, h, state: 'idle', open: 0, locked: false, opening: false }); ground(4);
    } else {
      ground(2); const s0 = x; ground(19);
      Lv.events.push({ type, trigger: s0, x: s0, h, state: 'idle', pairXs: [s0 + 6.5, s0 + 12.5], gateX: s0 + 17, pairs: null, tgt: null, checked: false, result: null });
    }
  }

  ground(18);
  const evs = ['cloud', 'door', 'target'];
  if (l >= 1) evs.push('chest');
  if (l >= 2) evs.push('cloud');
  if (l >= 3) evs.push('door');
  if (l >= 4) evs.push('target');
  for (let i = evs.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [evs[i], evs[j]] = [evs[j], evs[i]]; }
  const fc = l >= 3 ? 3 : 2;
  for (const ev of evs) { for (let k = 0; k < fc; k++) filler(); event(ev); }
  filler(); filler();
  ground(5); Lv.finishX = x; Lv.finishH = h; ground(14);

  const merged = [];
  for (const s of Lv.segs) {
    const m = merged[merged.length - 1];
    if (m && Math.abs(m.x1 - s.x0) < 1e-6 && m.h === s.h) m.x1 = s.x1; else merged.push({ ...s });
  }
  Lv.segs = merged;
  for (const s of merged) {
    for (let t = s.x0 + 0.8; t < s.x1 - 0.8; t += 1.4) {
      if (rand() < 0.35) Lv.deco.push({ x: t + rand() * 0.5, h: s.h, k: wd.deco[Math.floor(rand() * wd.deco.length)], v: rand() });
    }
  }
  return Lv;
}

/* ================= OYUN DURUMU ================= */
const cvs = $('game');
const mainCtx = cvs.getContext('2d');
let ctx = mainCtx;
let W = 0, H = 0, DPR = 1, T = 40, baseY = 0;
const cam = { x: 0, y: 0 };
const sx = wx => (wx - cam.x) * T;
const sy = wy => baseY - (wy - cam.y) * T;

const G = 30, JUMP = 10, HOLD_G = 0.3, HOLD_MAX = 0.22, COYOTE = 0.12, BUFFER = 0.16, SPEED = 4, HW = 0.26;
let L = null, cur = { w: 0, l: 0 };
const P = { held: false, holdT: 0.22, x: 0, y: 0, vy: 0, prevY: 0, onGround: true, coyote: 0, buffer: 0, mode: 'freeze', freeze: 0, inv: 0, phase: 0, camH: 0, airT: 0, safeSeg: null, script: null, onFallEnd: null, winT: 0 };
const run = { lives: 3, coins: 0, correct: 0, wrong: 0, wrongList: [], ev: null, q: null, total: 0, path: [] };
let state = 'boot', paused = false, tipOpen = false;
let time = 0, shake = 0, flashA = 0, flashC = '255,90,95', popHeart = -1, lastQ = '';
const particles = [], timers = [];
function addTimer(t, fn) { timers.push({ t, fn }); }

function segAt(x) { const s = L.segs; for (let i = 0; i < s.length; i++) if (x >= s[i].x0 && x <= s[i].x1) return s[i]; return null; }
function hAt(x) { const s = segAt(x); return s ? s.h : -Infinity; }

function startLevel(w, l) {
  ensureAudio();
  cur = { w, l }; save.last = { w, l }; writeSave();
  L = buildLevel(w, l);
  timers.length = 0; particles.length = 0;
  Object.assign(P, { held: false, holdT: HOLD_MAX, x: 0, y: 0, vy: 0, prevY: 0, onGround: true, coyote: 0, buffer: 0, mode: 'freeze', freeze: 0.9, inv: 0, phase: 0, camH: 0, airT: 0, script: null, onFallEnd: null, winT: 0 });
  P.safeSeg = segAt(0);
  Object.assign(run, { lives: 3, coins: 0, correct: 0, wrong: 0, wrongList: [], ev: null, q: null, total: 0, path: [] });
  cam.x = P.x - (W / T) * (H >= W ? 0.22 : 0.3); cam.y = 0;
  ['scrMap', 'win', 'fail', 'pause', 'qcard', 'targetPill', 'tip'].forEach(hide);
  $('toast').className = '';
  show('hud');
  paused = false; tipOpen = false; state = 'play';
  const wd = WORLDS[w];
  $('lvlName').innerHTML = `<span class="lop" style="background:${wd.accent}">${wd.op}</span>Bölüm ${l + 1}`;
  popHeart = -1; renderHearts(); updateCoins();
  showTip('jump2', null);
}

function levelUpdate(dt) {
  for (let i = timers.length - 1; i >= 0; i--) {
    timers[i].t -= dt;
    if (timers[i].t <= 0) { const f = timers[i].fn; timers.splice(i, 1); f(); if (state !== 'play') return; }
  }
  for (const en of L.enemies) {
    if (!en.alive) continue;
    en.t += dt; en.x += en.dir * 0.9 * dt;
    if (en.x < en.min) { en.x = en.min; en.dir = 1; }
    if (en.x > en.max) { en.x = en.max; en.dir = -1; }
  }
  animateEvents(dt);
  if (P.inv > 0) P.inv -= dt;
  switch (P.mode) {
    case 'run': runStep(dt); break;
    case 'script': scriptStep(dt); break;
    case 'fall':
      P.vy -= G * dt; P.y += P.vy * dt;
      if (P.y < -4) { P.mode = 'limbo'; const f = P.onFallEnd; P.onFallEnd = null; if (f) f(); }
      break;
    case 'freeze': P.freeze -= dt; if (P.freeze <= 0) P.mode = 'run'; break;
    case 'win':
      P.x += SPEED * dt; P.phase += dt * SPEED * 2.4; P.winT -= dt;
      if (P.winT <= 0) { P.mode = 'done'; finishLevel(); }
      break;
    default: break;
  }
  const vw = W / T;
  cam.x += ((P.x - vw * (H >= W ? 0.22 : 0.3)) - cam.x) * Math.min(1, dt * 10);
  cam.y += (P.camH - cam.y) * Math.min(1, dt * 4);
  if (shake > 0) shake -= dt;
  if (flashA > 0) flashA -= dt * 1.2;
}

function runStep(dt) {
  const ev = run.ev;
  const slow = ev && ev.type === 'target' && ev.state === 'running';
  const speed = slow ? SPEED * 0.8 : SPEED;
  P.buffer -= dt;
  if (P.buffer > 0 && (P.onGround || P.coyote > 0)) {
    P.vy = JUMP; P.holdT = 0; P.onGround = false; P.coyote = 0; P.buffer = 0; P.airT = 0;
    sfx.jump(); dust(P.x, P.y, 4);
  }
  let nx = P.x + speed * dt;
  const f = segAt(nx + HW);
  if (f && f.h > P.y + 0.08) nx = Math.max(P.x, f.x0 - HW - 0.001);
  P.x = nx;
  P.prevY = P.y;
  let g = G;
  if (P.held && P.vy > 0 && P.holdT < HOLD_MAX) { g = G * HOLD_G; P.holdT += dt; }
  else P.holdT = HOLD_MAX;
  P.vy = Math.max(-24, P.vy - g * dt);
  P.y += P.vy * dt;
  const hu = Math.max(hAt(P.x - HW), hAt(P.x + HW));
  if (P.vy <= 0 && P.prevY >= hu - 0.001 && P.y <= hu) {
    if (!P.onGround && P.airT > 0.25) dust(P.x, hu, 5);
    P.y = hu; P.vy = 0; P.onGround = true; P.coyote = COYOTE; P.airT = 0; P.camH = hu;
    const s = segAt(P.x); if (s) P.safeSeg = s;
  } else {
    P.onGround = false; P.coyote -= dt; P.airT += dt;
  }
  if (P.onGround) P.phase += dt * speed * 2.4;
  if (P.y < -3) { pitFall(); return; }

  collectCoins(); checkHazards(); checkEnemies();

  for (const e of L.events) {
    if (e.state === 'idle' && P.x >= e.trigger) { P.x = e.trigger; beginEvent(e); return; }
  }
  if (ev && ev.type === 'target' && ev.state === 'running') targetStep(ev);
  if (P.x >= L.finishX && P.mode === 'run') {
    P.mode = 'win'; P.winT = 1.8; sfx.win();
    burst(sx(L.finishX), sy(L.finishH + 3), 40, CONFETTI);
  }
}

function collectCoins() {
  const cy = P.y + 0.55;
  for (const c of L.coins) {
    if (c.taken) continue;
    const dx = c.x - P.x;
    if (dx < -1 || dx > 1) continue;
    if (Math.abs(dx) < 0.55 && Math.abs(c.y - cy) < 0.75) {
      c.taken = true; run.coins++; sfx.coin(); sparkle(sx(c.x), sy(c.y)); updateCoins();
    }
  }
}
function checkHazards() {
  for (const hz of L.hazards) {
    if (P.x + HW * 0.8 > hz.x + 0.1 && P.x - HW * 0.8 < hz.x + hz.w - 0.1 && P.y < hz.y + 0.45) hurt();
  }
}
function checkEnemies() {
  for (const en of L.enemies) {
    if (!en.alive) continue;
    if (Math.abs(en.x - P.x) < 0.6 && P.y < en.y + 0.75 && P.y + 1 > en.y) {
      if (P.vy < 0 && P.prevY >= en.y + 0.35) {
        en.alive = false; P.vy = 9; P.holdT = HOLD_MAX; sfx.stomp();
        poof(sx(en.x), sy(en.y + 0.35), '#FFFFFF');
        run.coins += 2; updateCoins(); floatText('+2', sx(en.x), sy(en.y + 1.2), '#FFD23F');
      } else hurt();
    }
  }
}
function hurt() {
  if (P.inv > 0) return;
  P.inv = 1.4;
  const lose = Math.min(3, run.coins);
  run.coins -= lose;
  for (let i = 0; i < lose; i++) particles.push({ x: sx(P.x), y: sy(P.y + 0.8), vx: (Math.random() - 0.5) * 300, vy: -Math.random() * 300 - 150, life: 1, decay: 1.1, size: T * 0.18, color: '#FFD23F', coin: true, rot: 0, vr: 0 });
  P.vy = Math.max(P.vy, 7); P.holdT = HOLD_MAX; P.onGround = false;
  shake = 0.3; sfx.hurt(); vibrate(60);
  if (lose) floatText('−' + lose, sx(P.x), sy(P.y + 1.6), '#FF5A5F');
  updateCoins();
}
function pitFall() {
  sfx.fall();
  const lose = Math.min(2, run.coins);
  run.coins -= lose;
  const s = P.safeSeg || L.segs[0];
  P.x = Math.max(s.x0 + 0.4, s.x1 - 2.8); P.y = s.h; P.vy = 0; P.onGround = true; P.camH = s.h;
  P.mode = 'freeze'; P.freeze = 0.7; P.inv = 1.6;
  updateCoins();
  showToast(lose ? `Düştün! −${lose} altın` : 'Düştün! Tekrar dene', 'bad', 1100);
}

function startScript(x1, y1, dur, cb) {
  P.mode = 'script';
  P.script = { x0: P.x, y0: P.y, x1, y1, dur, t: 0, cb, arc: 1.0 + Math.abs(x1 - P.x) * 0.15 };
  sfx.jump();
}
function scriptStep(dt) {
  const s = P.script;
  s.t += dt;
  const u = Math.min(1, s.t / s.dur);
  P.x = s.x0 + (s.x1 - s.x0) * u;
  P.y = s.y0 + (s.y1 - s.y0) * u + s.arc * 4 * u * (1 - u);
  P.camH = s.y1;
  if (u >= 1) { P.mode = 'wait'; P.script = null; if (s.cb) s.cb(); }
}

/* ---------- matematik anları ---------- */
function beginEvent(e) {
  run.ev = e; P.mode = 'wait'; P.vy = 0; P.y = e.h; P.onGround = true; P.camH = e.h;
  e.state = 'pending';
  showTip(e.type, () => { if (e.type === 'target') showTargetSign(e); else askQuestion(e); });
}

function askQuestion(e) {
  let q, k = 0;
  do { q = genQ(L.world.op, L.l); } while (q.text === lastQ && k++ < 10);
  lastQ = q.text;
  const o = makeOptions(q);
  run.q = { ...q, answers: o.answers, correct: o.correct };
  e.state = 'ask';
  if (e.type === 'cloud') e.clouds.forEach((c, i) => { c.alive = true; c.res = null; c.val = o.answers[i]; });
  const hints = { cloud: 'Doğru cevabın bulutuna dokun', door: 'Kapıyı açan cevabı seç', chest: 'Bonus sandık! Doğru cevap altın kazandırır' };
  showQCard(hints[e.type], `${q.text} = <span class="qm">?</span>`, o.answers);
}

function answer(i) {
  const e = run.ev;
  if (state !== 'play' || paused || tipOpen || !e || e.state !== 'ask') return;
  const q = run.q, ok = i === q.correct;
  e.state = 'busy';
  markOpts(i, q.correct);
  setQ(`${q.text} = <span class="qm ${ok ? 'ok' : 'no'}">${q.ans}</span>`);
  if (ok) {
    run.correct++; sfx.correct(); flashC = '47,203,122'; flashA = 0.15;
    showToast(pick(PRAISE), 'good', 900);
  } else {
    run.wrongList.push({ text: q.text, ans: q.ans, given: q.answers[i] });
    sfx.wrong(); vibrate(); flashC = '255,90,95'; flashA = 0.3; shake = 0.35;
    if (e.type !== 'chest') { run.wrong++; run.lives--; popHeart = run.lives; renderHearts(); }
    showToast(`Olsun! <b>${q.text} = ${q.ans}</b>`, 'bad', 1900);
  }
  if (e.type === 'cloud') cloudAnswer(e, i, ok);
  else if (e.type === 'door') doorAnswer(e, ok);
  else chestAnswer(e, ok);
}

function cloudAnswer(e, i, ok) {
  const c = e.clouds[i];
  startScript(c.x, c.y, 0.55, () => {
    if (ok) {
      c.res = 'ok';
      e.clouds.forEach((cc, j) => { if (j !== i) cc.alive = false; });
      burst(sx(c.x), sy(c.y) + T * 0.3, 26, CONFETTI);
      hideQCardSoon(0.6);
      addTimer(0.45, () => startScript(e.ex + e.pw + 0.6, e.h, 0.6, () => {
        e.state = 'done'; run.ev = null; P.mode = 'run'; P.onGround = true;
        P.safeSeg = segAt(P.x) || P.safeSeg;
      }));
    } else {
      c.alive = false;
      poof(sx(c.x), sy(c.y) + T * 0.35, '#FFFFFF');
      P.mode = 'fall'; P.vy = 1;
      P.onFallEnd = () => addTimer(0.5, () => {
        if (run.lives <= 0) { failLevel(); return; }
        P.x = e.trigger; P.y = e.h; P.vy = 0; P.camH = e.h; P.mode = 'wait'; P.inv = 0.8;
        addTimer(0.4, () => askQuestion(e));
      });
    }
  });
}
function doorAnswer(e, ok) {
  if (ok) {
    e.state = 'opening'; sfx.door(); hideQCardSoon(0.6);
    addTimer(0.8, () => { e.state = 'done'; run.ev = null; P.mode = 'run'; });
  } else {
    e.shake = 0.5;
    addTimer(1.9, () => { if (run.lives <= 0) { failLevel(); return; } askQuestion(e); });
  }
}
function chestAnswer(e, ok) {
  const done = () => { e.state = 'done'; run.ev = null; P.mode = 'run'; };
  if (ok) {
    e.opening = true; run.coins += 5; updateCoins();
    for (let k = 0; k < 8; k++) particles.push({ x: sx(e.x), y: sy(e.h + 0.7), vx: (Math.random() - 0.5) * 260, vy: -Math.random() * 380 - 220, life: 1, decay: 0.9, size: T * 0.18, color: '#FFD23F', coin: true, rot: 0, vr: 0 });
    floatText('+5', sx(e.x), sy(e.h + 1.8), '#FFD23F');
    hideQCardSoon(0.8); addTimer(0.9, done);
  } else {
    e.locked = true; hideQCardSoon(1.8); addTimer(1.9, done);
  }
}

function showTargetSign(e) {
  const t = genTarget(L.world.op, L.l);
  e.tgt = t;
  e.pairs = e.pairXs.map((x, k) => {
    const [a, b] = t.pairs[k];
    const aUp = Math.random() < 0.5;
    return { x, up: aUp ? a : b, down: aUp ? b : a, taken: null };
  });
  run.total = t.start; run.path = [];
  e.state = 'sign';
  showQCard('Hedef sayıya ulaş!', `<span class="chip">Başlangıç <b>${t.start}</b></span><span class="chip goal">Hedef <b>${t.T}</b></span>`, null);
}
function targetReady() {
  const e = run.ev;
  if (!e || e.type !== 'target' || e.state !== 'sign' || paused || tipOpen) return;
  e.state = 'running';
  hideQCard(); sfx.click();
  $('tpT').textContent = e.tgt.T; updateTargetPill(false); show('targetPill');
  P.mode = 'run';
}
function targetStep(e) {
  for (const pr of e.pairs) {
    if (!pr.taken && P.x >= pr.x) {
      const up = P.y > e.h + 0.7;
      pr.taken = up ? 'up' : 'down';
      const v = up ? pr.up : pr.down;
      run.total = applyOp(run.total, L.world.op, v);
      run.path.push(v);
      sfx.coin();
      const yy = up ? e.h + 1.95 : e.h + 0.55;
      sparkle(sx(pr.x), sy(yy));
      floatText(`${L.world.op}${v}`, sx(pr.x), sy(yy) - T * 0.7, '#FFD23F');
      updateTargetPill(true);
    }
  }
  if (!e.checked && P.x >= e.gateX - 1.3) checkTarget(e);
}
function checkTarget(e) {
  e.checked = true;
  const t = e.tgt, op = L.world.op, ok = run.total === t.T;
  e.result = ok ? 'ok' : 'bad';
  if (ok) {
    run.correct++; run.coins += 3; updateCoins(); sfx.correct();
    burst(sx(e.gateX), sy(e.h + 3.2), 34, CONFETTI);
    showToast('Hedef tuttu! 🎯', 'good', 1300);
  } else {
    run.wrong++; run.lives--; popHeart = run.lives; renderHearts();
    sfx.wrong(); vibrate(); shake = 0.35; flashC = '255,90,95'; flashA = 0.3;
    const k = Math.max(0, t.pairs[0].indexOf(run.path[0]));
    const a1 = t.pairs[0][k], a2 = t.pairs[1][k];
    const expr = (op === '+' && t.start === 0) ? `${a1} + ${a2}` : `${t.start} ${op} ${a1} ${op} ${a2}`;
    run.wrongList.push({ text: expr, ans: t.T, given: run.total, target: true });
    showToast(`Sende <b>${run.total}</b> oldu, hedef ${t.T} idi`, 'bad', 2100);
  }
  addTimer(1.3, () => hide('targetPill'));
  e.state = 'done'; run.ev = null;
  if (run.lives <= 0) { P.mode = 'wait'; addTimer(2.1, failLevel); }
}

function animateEvents(dt) {
  for (const e of L.events) {
    if (e.type === 'cloud') {
      const act = e.state === 'ask' || e.state === 'busy';
      for (const c of e.clouds) { const tg = act && c.alive ? 1 : 0; c.vis += (tg - c.vis) * Math.min(1, dt * (tg ? 7 : 9)); }
    } else if (e.type === 'door') {
      if (e.state === 'opening' || e.state === 'done') e.open = Math.min(1, e.open + dt * 2);
      if (e.shake > 0) e.shake -= dt;
    } else if (e.type === 'chest' && e.opening) e.open = Math.min(1, e.open + dt * 3);
  }
}

function finishLevel() {
  if (state !== 'play') return;
  state = 'result';
  const stars = run.wrong === 0 ? 3 : run.wrong === 1 ? 2 : 1;
  const k = keyOf(cur.w, cur.l);
  save.stars[k] = Math.max(save.stars[k] || 0, stars);
  save.coins += run.coins;
  writeSave();
  ['hud', 'qcard', 'targetPill'].forEach(hide); $('toast').className = '';
  $('winTitle').textContent = stars === 3 ? 'Mükemmel!' : 'Bölüm tamam!';
  $('bigStars').innerHTML = [0, 1, 2].map(i => `<i class="${i < stars ? 'on' : ''}" style="--d:${0.25 + i * 0.3}s">${STAR_SVG}</i>`).join('');
  $('starTip').textContent = stars === 3 ? 'Hiç can kaybetmeden bitirdin!' : '3 yıldız için hiç can kaybetmeden bitir.';
  $('stCorrect').textContent = run.correct;
  $('stWrong').textContent = run.wrongList.length;
  $('stCoins').textContent = run.coins;
  fillReview($('winReview'), $('winRevLabel'));
  const nb = $('nextBtn');
  if (cur.l < 4) { nb.textContent = 'Sonraki bölüm'; nb.onclick = () => startLevel(cur.w, cur.l + 1); }
  else if (cur.w < 3) { nb.textContent = 'Sonraki dünya'; nb.onclick = () => startLevel(cur.w + 1, 0); }
  else { nb.textContent = 'Haritaya dön'; nb.onclick = openMap; }
  show('win');
}
function failLevel() {
  if (state !== 'play') return;
  state = 'result';
  ['hud', 'qcard', 'targetPill'].forEach(hide); $('toast').className = '';
  fillReview($('failReview'), null);
  show('fail');
  sfx.lose();
}
function fillReview(el, labelEl) {
  const seen = new Set();
  el.innerHTML = '';
  for (const wr of run.wrongList) {
    if (seen.has(wr.text) || seen.size >= 10) continue;
    seen.add(wr.text);
    const d = document.createElement('div');
    d.className = 'rv';
    d.innerHTML = `${wr.text} = ${wr.ans}<small>${wr.target ? 'sende olan' : 'senin cevabın'}: ${wr.given}</small>`;
    el.appendChild(d);
  }
  if (labelEl) labelEl.classList.toggle('hidden', !seen.size);
  if (!seen.size) el.innerHTML = '<div class="perfect">Hiç yanlış yok, harikasın! 🎉</div>';
}

/* ================= ÇİZİM YARDIMCILARI ================= */
function rr(x, y, w, h, r) {
  if (h < 0) { y += h; h = -h; }
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fill(); }
function tri(a, b, c, d, e, f) { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); ctx.fill(); ctx.stroke(); }
function starPath(r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.47 : r; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
  ctx.closePath();
}
function inkText(txt, x, y, size, maxW) {
  ctx.font = `800 ${size}px ${FONT}`;
  const w = ctx.measureText(txt).width;
  if (maxW && w > maxW) { size *= maxW / w; ctx.font = `800 ${size}px ${FONT}`; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = INK;
  ctx.fillText(txt, x, y + size * 0.05);
}
function outText(txt, x, y, size, fill, maxW) {
  ctx.font = `800 ${size}px ${FONT}`;
  const w = ctx.measureText(txt).width;
  if (maxW && w > maxW) { size *= maxW / w; ctx.font = `800 ${size}px ${FONT}`; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.18; ctx.strokeStyle = INK; ctx.strokeText(txt, x, y + size * 0.05);
  ctx.fillStyle = fill; ctx.fillText(txt, x, y + size * 0.05);
}

/* ================= KARAKTERLER ================= */
function limb(px, py, ang, w, len, fill, foot) {
  ctx.save(); ctx.translate(px, py); ctx.rotate(ang);
  ctx.fillStyle = fill; rr(-w / 2, -w * 0.3, w, len + w * 0.3, w / 2); ctx.fill(); ctx.stroke();
  if (foot) { ctx.fillStyle = foot; rr(-w * 0.55, len - w * 0.45, w * 1.7, w * 0.8, w * 0.4); ctx.fill(); ctx.stroke(); }
  ctx.restore();
}
function drawGirl(h, fl, bl, fa, ba) {
  const skin = '#F5C9A6', skin2 = '#E3AD86', hair = '#6B3B24';
  const hipY = -h * 0.34, shY = -h * 0.62, hx = h * 0.03, hy = -h * 0.82, hr = h * 0.18;
  const sw = Math.sin(time * 9) * h * 0.02;
  ctx.fillStyle = hair; ctx.beginPath();
  ctx.moveTo(hx - hr * 0.6, hy - hr * 0.55);
  ctx.quadraticCurveTo(hx - hr * 2.1, hy - hr * 0.6 + sw, hx - hr * 1.75, hy + hr * 0.95 + sw);
  ctx.quadraticCurveTo(hx - hr * 1.2, hy + hr * 0.2, hx - hr * 0.7, hy + hr * 0.1);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  limb(-h * 0.01, shY, ba, h * 0.08, h * 0.22, skin2);
  limb(-h * 0.03, hipY, bl, h * 0.1, h * 0.29, skin2, '#FFFFFF');
  ctx.fillStyle = '#2F3A8F'; rr(-h * 0.13, hipY - h * 0.08, h * 0.26, h * 0.13, h * 0.05); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#8C5CF0'; rr(-h * 0.13, -h * 0.67, h * 0.26, h * 0.27, h * 0.08); ctx.fill(); ctx.stroke();
  limb(h * 0.03, hipY, fl, h * 0.1, h * 0.29, skin, '#FFFFFF');
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = hair; ctx.beginPath();
  ctx.arc(hx, hy, hr, Math.PI * 0.72, Math.PI * 1.9);
  ctx.quadraticCurveTo(hx + hr * 0.2, hy - hr * 0.35, hx - hr * 0.25, hy + hr * 0.15);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK; circle(hx + hr * 0.52, hy + hr * 0.05, hr * 0.12);
  ctx.fillStyle = 'rgba(255,107,139,.45)'; circle(hx + hr * 0.42, hy + hr * 0.5, hr * 0.17);
  ctx.beginPath(); ctx.arc(hx + hr * 0.6, hy + hr * 0.42, hr * 0.2, 0.4, 1.4); ctx.stroke();
  ctx.fillStyle = '#FFB627'; ctx.beginPath(); ctx.arc(hx - hr * 0.72, hy - hr * 0.35, hr * 0.22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  limb(h * 0.01, shY, fa, h * 0.08, h * 0.22, skin);
}
function drawCat(h, fl, bl, fa, ba) {
  const o = '#FFA552', o2 = '#E8883A', cr = '#FFE7C9', lw = ctx.lineWidth;
  const tw = Math.sin(time * 5) * h * 0.04;

  ctx.quadraticCurveTo(-h * 0.45, -h * 0.42 + tw, -h * 0.36, -h * 0.8 + tw);
  ctx.strokeStyle = INK; ctx.lineWidth = h * 0.09 + lw * 2; ctx.stroke();

  ctx.fillStyle = o; rr(-h * 0.15, -h * 0.66, h * 0.3, h * 0.36, h * 0.14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = cr; ctx.beginPath(); ctx.ellipse(h * 0.05, -h * 0.47, h * 0.08, h * 0.12, 0, 0, Math.PI * 2); ctx.fill();
  limb(h * 0.04, -h * 0.33, fl, h * 0.11, h * 0.28, o, cr);

  ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = o2; ctx.lineWidth = lw * 1.2; ctx.beginPath();
  ctx.moveTo(hx - hr * 0.25, hy - hr * 0.92); ctx.lineTo(hx - hr * 0.18, hy - hr * 0.6);
  ctx.moveTo(hx + hr * 0.12, hy - hr * 0.96); ctx.lineTo(hx + hr * 0.1, hy - hr * 0.62);
  ctx.stroke(); ctx.strokeStyle = INK; ctx.lineWidth = lw;
  ctx.fillStyle = cr; ctx.beginPath(); ctx.ellipse(hx + hr * 0.55, hy + hr * 0.38, hr * 0.42, hr * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = INK; circle(hx + hr * 0.42, hy - hr * 0.1, hr * 0.13);
  ctx.fillStyle = '#FF8FAB'; circle(hx + hr * 0.92, hy + hr * 0.22, hr * 0.1);
  ctx.lineWidth = Math.max(1, lw * 0.6); ctx.beginPath();
  ctx.moveTo(hx + hr * 0.72, hy + hr * 0.45); ctx.lineTo(hx + hr * 1.32, hy + hr * 0.35);
  ctx.moveTo(hx + hr * 0.72, hy + hr * 0.55); ctx.lineTo(hx + hr * 1.3, hy + hr * 0.68);
  ctx.stroke(); ctx.lineWidth = lw;
  limb(h * 0.03, -h * 0.6, fa, h * 0.085, h * 0.2, o, null);
}
function drawRobot(h, fl, bl, fa, ba) {
  const m = '#B7C6D6', m2 = '#8FA3B8';
  limb(-h * 0.01, -h * 0.6, ba, h * 0.075, h * 0.22, m2);
  limb(-h * 0.04, -h * 0.34, bl, h * 0.1, h * 0.29, m2, '#5A6B80');
  ctx.fillStyle = m2; rr(-h * 0.1, -h * 0.4, h * 0.2, h * 0.08, h * 0.03); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#3FA7F5'; rr(-h * 0.15, -h * 0.68, h * 0.3, h * 0.3, h * 0.06); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#FFD23F'; circle(h * 0.04, -h * 0.53, h * 0.045); ctx.stroke();

function burst(x, y, n, colors) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 480, vy: -Math.random() * 450 - 80, life: 1, decay: 0.8 + Math.random() * 0.6, size: 5 + Math.random() * 6, color: pick(colors), rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12 });
}
function sparkle(x, y) {
  for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; particles.push({ x, y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, life: 1, decay: 2.6, size: 4, color: '#FFF3A0', dot: true, noGrav: true, rot: 0, vr: 0 }); }
}
function poof(x, y, color) {
  for (let i = 0; i < 12; i++) particles.push({ x: x + (Math.random() - 0.5) * T * 0.8, y: y + (Math.random() - 0.5) * T * 0.4, vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 60, life: 1, decay: 1.8, size: T * (0.12 + Math.random() * 0.12), color, dot: true, grow: true, noGrav: true, rot: 0, vr: 0 });
}
function dust(wx, wy, n) {
  for (let i = 0; i < n; i++) particles.push({ x: sx(wx) + (Math.random() - 0.5) * T * 0.4, y: sy(wy), vx: (Math.random() - 0.6) * 90, vy: -Math.random() * 40, life: 1, decay: 3, size: T * 0.08, color: 'rgba(255,255,255,.85)', dot: true, grow: true, noGrav: true, rot: 0, vr: 0 });
}
function floatText(text, x, y, color) {
  particles.push({ text, x, y, vx: 0, vy: -80, life: 1, decay: 1, size: Math.max(24, T * 0.6), color, noGrav: true, rot: 0, vr: 0 });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (!p.noGrav) p.vy += 950 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);

}

  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life * 1.5, 0, 1);
    if (p.text) outText(p.text, p.x, p.y, p.size, p.color);
    else if (p.coin) { ctx.fillStyle = INK; circle(p.x, p.y, p.size + 2); ctx.fillStyle = p.color; circle(p.x, p.y, p.size); }
    else if (p.dot) { ctx.fillStyle = p.color; circle(p.x, p.y, p.size * (p.grow ? 1.8 - p.life : 1)); }
    else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!L) return;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 24, (Math.random() - 0.5) * shake * 12);
  drawBack();
  drawAbyss();
  for (const d of L.deco) drawDeco(d);
  for (const s of L.segs) drawSeg(s);

  for (const e of L.events) {

  for (const c of L.coins) if (!c.taken) drawCoin(c);

window.addEventListener('keydown', e => {
  if (tipOpen) { if (e.key === 'Enter' || e.code === 'Space') { e.preventDefault(); closeTip(); } return; }
  if (paused) { if (e.key === 'Escape' || e.key === 'p') resumeGame(); return; }
  if (state !== 'play') return;
  const ev = run.ev;
  if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'Enter') {
    e.preventDefault();
    if (ev && ev.state === 'sign') targetReady();
    else if (P.mode === 'run' && !e.repeat) { P.buffer = BUFFER; P.held = true; }
  } else if (e.key === '1' || e.key === '2' || e.key === '3') answer(+e.key - 1);
  else if (e.key === 'Escape' || e.key === 'p') pauseGame();
});
window.addEventListener('keyup', e => { if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w') P.held = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

if (DEBUG) window.__sd = { startLevel, answer, targetReady, closeTip, openMap, get P() { return P; }, get run() { return run; }, get L() { return L; }, get state() { return state; }, save };

loadSave();
soundOn = save.sound !== false;
$('btnSound').textContent = soundOn ? '🔊' : '🔇';
$('soundBtn2').textContent = soundOn ? '🔊 Ses açık' : '🔇 Ses kapalı';
resize();
if (save.char) { refreshAvatar(); openMap(); } else openChar();
requestAnimationFrame(frame);
})();
</script>
